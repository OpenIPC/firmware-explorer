name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 04:30 UTC daily, well after firmware (00:11) and builder (~07:20)
    # nightlies have settled. Cron format: minute hour dom month dow.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # `npm run build` invokes `npm run prebuild` first, which uses the
      # built-in `gh` CLI to download `sizes.*.json` release assets from
      # OpenIPC/firmware and OpenIPC/builder, server-side. CORS is structurally
      # not a question during this step — only the in-browser fetches need to
      # stay same-origin.
      - run: npm run build
        env:
          GH_TOKEN: ${{ github.token }}
      # `actions/configure-pages` fetches Pages config via the GitHub API.
      # That call hits the workflow's installation-wide token rate limit
      # during busy cron windows (07:20–07:50 UTC saw two consecutive
      # deploys fail here: runs 28698970626 and 28733698722). Retry with
      # backoff instead of `uses:`-ing the action directly, since the
      # limit resets on a rolling hour and short waits usually clear it.
      - name: Configure Pages (attempt 1)
        id: pages_try1
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Wait before retry
        if: steps.pages_try1.outcome == 'failure'
        run: sleep 45
      - name: Configure Pages (attempt 2)
        id: pages_try2
        if: steps.pages_try1.outcome == 'failure'
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Wait before final retry
        if: steps.pages_try1.outcome == 'failure' && steps.pages_try2.outcome == 'failure'
        run: sleep 120
      - name: Configure Pages (attempt 3)
        if: steps.pages_try1.outcome == 'failure' && steps.pages_try2.outcome == 'failure'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

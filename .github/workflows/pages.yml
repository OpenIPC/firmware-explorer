name: Deploy to GitHub Pages

# The explorer moved to https://openipc.org/firmware-explorer, where OpenIPC's
# build CI pushes each build once (OpenIPC/website#311). This site is only a
# redirect now: every address, including old deep links, lands on the new page
# with its query string.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4

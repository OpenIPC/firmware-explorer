name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 04:30 UTC daily, well after firmware (00:11) and builder (~07:20)
    # nightlies have settled. Cron format: minute hour dom month dow.
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # `npm run build` invokes `npm run prebuild` first. Prebuild enumerates
      # releases with ONE paginated `gh api /releases` call per source and
      # fetches asset bytes via anonymous HTTPS on the browser_download_url —
      # both to slash our footprint against the installation-wide API rate
      # limit, which was blowing up consecutive nightly deploys in the busy
      # 07:20–07:50 UTC cron window (runs 28646280479 / 28698970626 /
      # 28733698722). See scripts/prebuild.mts.
      - run: npm run build
        env:
          GH_TOKEN: ${{ github.token }}
      # `actions/configure-pages@v5` was dropped: its only job was to fetch
      # Pages site config via the API, and it was tripping on the same rate
      # limit (runs 28698970626 / 28733698722). We don't consume any of its
      # outputs (Vite `base` is hardcoded), and `deploy-pages@v4` works
      # without it as long as Pages is already enabled on the repo — which
      # it is, configured to build via GitHub Actions.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
